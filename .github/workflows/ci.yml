name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Export production Android bundle
        run: |
          output_dir="$RUNNER_TEMP/beginora-android-export"
          npx expo export --platform android --output-dir "$output_dir"
          bundle=$(find "$output_dir" -type f -name '*.hbc' -print -quit)
          test -n "$bundle" && test -s "$bundle"

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm run audit:ci

      - name: Tests
        run: npm test -- --passWithNoTests
